[project]
name = "remotelife-data"
version = "0.1.0"
description = "RemoteLife Tokyo のデータ加工パイプライン"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# src/ 直下にスクリプトを並べる構成のため、自身はパッケージとしてインストールしない
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
